# Template: Shopify Inventory Level Monitor
#
# Monitors inventory levels for products, detecting low-stock and
# out-of-stock conditions against configurable thresholds.
#
# Expected inputs (set on blackboard before calling):
#   lowStockThreshold: number   - Units below which stock is "low" (default: 10)
#
# Output:
#   snapshotData: array         - Metric snapshots for flagged variants
#   inventorySummary: object    - Summary counts

type: Sequence
id: inventory-level-monitor
children:
  # Step 1: Fetch products with inventory info from Shopify
  - type: IntegrationAction
    id: fetch-products
    props:
      provider: shopify
      action: get_products
      inputs: {}
      storeResult: true
      resultKey: products

  # Step 2: Count total products
  - type: Aggregate
    id: count-products
    props:
      input: "${bb.products}"
      outputKey: productStats
      operations:
        - type: count
          as: totalProducts

  # Step 3: Initialize accumulators
  - type: SetVariable
    id: init-snapshots
    props:
      key: snapshots
      value: []

  - type: SetVariable
    id: init-out-of-stock
    props:
      key: outOfStockCount
      value: 0

  - type: SetVariable
    id: init-low-stock
    props:
      key: lowStockCount
      value: 0

  # Step 4: Iterate products → variants, classify each
  - type: ForEach
    id: iterate-products
    props:
      collectionKey: products
      itemKey: currentProduct
    children:
      - type: ForEach
        id: iterate-variants
        props:
          collectionKey: currentProduct.variants
          itemKey: currentVariant
        children:
          - type: Sequence
            id: process-variant
            children:
              # Classify stock level
              - type: ThresholdCheck
                id: check-stock
                props:
                  value: "${bb.currentVariant.inventory_quantity}"
                  thresholds:
                    - operator: lte
                      value: 0
                      label: out_of_stock
                    - operator: lte
                      value: "${bb.lowStockThreshold}"
                      label: low_stock
                  outputKey: stockStatus

              # Build snapshot for this variant
              - type: DataTransform
                id: build-variant-snapshot
                props:
                  outputKey: currentSnapshot
                  mappings:
                    - target: metricName
                      value: "inventory_level"
                    - target: value
                      value: "${bb.currentVariant.inventory_quantity}"
                    - target: dimensions.sku
                      value: "${bb.currentVariant.sku}"
                    - target: dimensions.productTitle
                      value: "${bb.currentProduct.title}"
                    - target: dimensions.variantTitle
                      value: "${bb.currentVariant.title}"
                    - target: dimensions.status
                      value: "${bb.stockStatus}"
                    - target: source
                      value: "polling"
                    - target: context_json.productId
                      value: "${bb.currentProduct.id}"
                    - target: context_json.variantId
                      value: "${bb.currentVariant.id}"
                    - target: context_json.lowStockThreshold
                      value: "${bb.lowStockThreshold}"
