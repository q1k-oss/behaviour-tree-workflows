# Template: Shopify Order Volume Monitor
#
# Monitors order volume by fetching recent orders for a known customer.
# For store-wide order monitoring, use Mode 2 (shopify_graphql tool).
#
# Expected inputs (set on blackboard before calling):
#   customerId: string        - Shopify customer ID to monitor
#   lookbackMinutes: number   - Minutes to look back for counting orders (default: 60)
#   nowTimestamp: number       - Current timestamp in ms (set by caller)
#
# Output:
#   snapshotData: object      - Metric snapshot with order volume stats

type: Sequence
id: order-volume-monitor
children:
  # Step 1: Fetch customer orders from Shopify
  - type: IntegrationAction
    id: fetch-recent-orders
    props:
      provider: shopify
      action: get_customer_orders
      inputs:
        customerId: "${bb.customerId}"
      storeResult: true
      resultKey: recentOrders

  # Step 2: Compute cutoff timestamp
  - type: MathOp
    id: compute-cutoff
    props:
      expression: "${bb.nowTimestamp} - ${bb.lookbackMinutes} * 60 * 1000"
      outputKey: cutoffTimestamp

  # Step 3: Filter orders within time window
  - type: ArrayFilter
    id: filter-recent
    props:
      input: "${bb.recentOrders}"
      outputKey: windowOrders
      conditions:
        - field: created_at_ms
          operator: gte
          value: "${bb.cutoffTimestamp}"

  # Step 4: Aggregate order stats
  - type: Aggregate
    id: order-stats
    props:
      input: "${bb.windowOrders}"
      outputKey: orderStats
      operations:
        - type: count
          as: orderCount
        - type: sum
          field: total_price
          as: totalRevenue

  # Step 5: Group by financial status
  - type: Aggregate
    id: status-breakdown
    props:
      input: "${bb.windowOrders}"
      outputKey: statusBreakdown
      groupBy: financial_status
      operations:
        - type: count

  # Step 6: Compute hourly rate
  - type: MathOp
    id: compute-rate
    props:
      expression: "${bb.orderStats.orderCount} / (${bb.lookbackMinutes} / 60)"
      outputKey: hourlyRate
      round: round
      precision: 1

  # Step 7: Round revenue
  - type: MathOp
    id: round-revenue
    props:
      expression: "${bb.orderStats.totalRevenue}"
      outputKey: totalRevenue
      round: round
      precision: 2

  # Step 8: Build metric snapshot
  - type: DataTransform
    id: build-snapshot
    props:
      outputKey: snapshotData
      wrapInArray: true
      mappings:
        - target: metricName
          value: "order_volume_hourly"
        - target: value
          value: "${bb.hourlyRate}"
        - target: dimensions
          value: {}
        - target: source
          value: "computed"
        - target: context_json.orderCount
          value: "${bb.orderStats.orderCount}"
        - target: context_json.lookbackMinutes
          value: "${bb.lookbackMinutes}"
        - target: context_json.totalRevenue
          value: "${bb.totalRevenue}"
        - target: context_json.statusBreakdown
          value: "${bb.statusBreakdown}"
