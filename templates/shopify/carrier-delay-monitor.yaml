# Template: Shopify Carrier Delay Monitor
#
# Monitors unfulfilled orders for carrier pickup delays for a known customer.
# For store-wide order monitoring, use Mode 2 (shopify_graphql tool).
#
# Expected inputs (set on blackboard before calling):
#   customerId: string       - Shopify customer ID to monitor
#   thresholdHours: number   - Hours before an order is considered delayed (default: 12)
#
# Output:
#   snapshotData: object     - Metric snapshot with delay stats
#   totalOrders: number      - Total unfulfilled orders
#   totalDelayed: number     - Orders exceeding threshold

type: Sequence
id: carrier-delay-monitor
children:
  # Step 1: Fetch customer orders from Shopify
  - type: IntegrationAction
    id: fetch-customer-orders
    props:
      provider: shopify
      action: get_customer_orders
      inputs:
        customerId: "${bb.customerId}"
      storeResult: true
      resultKey: customerOrders

  # Step 2: Filter to unfulfilled orders only
  - type: ArrayFilter
    id: filter-unfulfilled
    props:
      input: "${bb.customerOrders}"
      outputKey: unfulfilledOrders
      conditions:
        - field: fulfillment_status
          operator: in
          value: [null, "unfulfilled"]

  # Step 3: Aggregate by carrier
  - type: Aggregate
    id: carrier-stats
    props:
      input: "${bb.unfulfilledOrders}"
      outputKey: carrierStats
      groupBy: shipping_carrier
      operations:
        - type: count
          as: totalOrders
        - type: avg
          field: pending_hours
          as: avgPendingHours
        - type: max
          field: pending_hours
          as: maxPendingHours

  # Step 4: Count totals
  - type: Aggregate
    id: total-stats
    props:
      input: "${bb.unfulfilledOrders}"
      outputKey: totalStats
      operations:
        - type: count
          as: totalOrders

  # Step 5: Count delayed orders (above threshold)
  - type: ArrayFilter
    id: filter-delayed
    props:
      input: "${bb.unfulfilledOrders}"
      outputKey: delayedOrders
      conditions:
        - field: pending_hours
          operator: gt
          value: "${bb.thresholdHours}"

  - type: Aggregate
    id: delayed-stats
    props:
      input: "${bb.delayedOrders}"
      outputKey: delayedStats
      operations:
        - type: count
          as: totalDelayed

  # Step 6: Build metric snapshot
  - type: DataTransform
    id: build-snapshot
    props:
      outputKey: snapshotData
      wrapInArray: true
      mappings:
        - target: metricName
          value: "pending_pickup_hours"
        - target: value
          value: "${bb.carrierStats}"
        - target: source
          value: "polling"
        - target: context_json.totalOrders
          value: "${bb.totalStats.totalOrders}"
        - target: context_json.totalDelayed
          value: "${bb.delayedStats.totalDelayed}"
        - target: context_json.thresholdHours
          value: "${bb.thresholdHours}"
